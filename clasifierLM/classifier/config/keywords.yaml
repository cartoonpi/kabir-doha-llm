# Keyword baseline v2: tag id -> English keywords (lowercase; multi-word phrases OK).
# Covers the approved 100-theme / 100-image vocabulary in tags.yaml.
# EXTEND THIS to make the baseline stronger. The original 10+10 entries are kept exactly as in v1.
#
# Matching is whole-word on the normalized text (same normalization as
# featurize.py), and a trailing "s" is also accepted ("lamp" matches "lamps"),
# so plurals are not listed separately.
#
# v2 rules of thumb: each list targets the specific angle in that tag's desc, so sibling
# themes overlap less (e.g. kshanik = brevity/dew/bubble, kaal = Time as devourer, mrityu = death itself).
# No keyword is shared by two themes, nor by two images (checked by script).
#
# Known weaknesses, kept on purpose so you can see a keyword system fail:
#   - "well" matches "I'm doing well"     (ambiguity)
#   - "light" matches "a light dinner"    (ambiguity)
#   - "my grandfather's last days" has no death keyword (indirect phrasing)

